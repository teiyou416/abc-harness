[project]
name = "abc-harness"
version = "0.1.0"
description = "Local CLI that turns a research question into an approved, reproducible blockchain simulation"
readme = "README.md"
authors = [
    { name = "teiyou", email = "teiyou416@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.10.0",
    "openai>=2",
    "prompt-toolkit>=3.0.53,<4",
]

[project.scripts]
abc-harness = "abc_harness:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "docker: needs a Docker daemon",
    "live: calls a real model or external API",
    "judge_eval: runs the judge over the gold cases in tests/fixtures/judge (about $0.2 a run)",
]

[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
